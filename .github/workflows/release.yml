name: Release

# Maintain a release PR from Conventional Commits. Merging that PR creates a
# draft release, then this workflow builds its assets and publishes it.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge for the release PR
        if: steps.release.outputs.prs_created == 'true'
        run: gh pr merge --auto --squash "$(jq -r .number <<<"$RELEASE_PR")"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}

  binaries:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          archive="herdr-prompt-library-${GOOS}-${GOARCH}.tar.gz"
          mkdir -p dist/bin
          go build -trimpath -ldflags="-s -w" -o dist/bin/herdr-prompt-library ./cmd/herdr-prompt-library
          tar -czf "$archive" -C dist bin/herdr-prompt-library -C "$GITHUB_WORKSPACE" herdr-plugin.toml
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" herdr-prompt-library-* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}

      - name: Attest archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: herdr-prompt-library-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  publish:
    if: needs.release.outputs.release_created == 'true'
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
